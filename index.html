<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #FFD700;
    --gold2: #FFA500;
    --dark: #0a0a1a;
    --dark2: #12122a;
    --dark3: #1a1a3e;
    --accent: #6c3fff;
    --accent2: #a855f7;
    --text: #e8e8f0;
    --text2: #a0a0c0;
    --card: #16163a;
    --card2: #1e1e45;
    --border: rgba(108,63,255,0.3);
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── STARS BACKGROUND ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(108,63,255,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(255,165,0,0.05) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── LANG SWITCHER ─── */
  .lang-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,26,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    padding: 10px 20px;
    gap: 8px;
  }
  .lang-btn {
    padding: 6px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 0 12px rgba(108,63,255,0.5);
  }
  .lang-btn:hover:not(.active) {
    border-color: var(--accent);
    color: #fff;
  }

  /* ─── MAIN WRAPPER ─── */
  .page { position: relative; z-index: 1; }

  /* ─── BLOCK ─── */
  .block {
    padding: 60px 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .block + .block {
    border-top: 1px solid var(--border);
  }

  /* ─── TITLE ─── */
  .style-title {
    text-align: center;
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--gold2), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    margin-bottom: 16px;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(255,215,0,0.3));
  }

  /* ─── SUBTITLE ─── */
  .style-subtitle {
    text-align: center;
    font-size: clamp(14px, 2.5vw, 18px);
    color: var(--text2);
    line-height: 1.7;
    max-width: 700px;
    margin: 0 auto 24px;
  }

  /* ─── H1 ─── */
  .style-h1 {
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 800;
    margin: 12px 0 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .style-h1 a {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
  }
  .style-h1 a:hover { opacity: 0.8; }
  .style-h1 span {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .style-h1::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 1em;
    background: linear-gradient(to bottom, var(--gold), var(--accent));
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ─── H3 ─── */
  .style-h3 {
    font-size: clamp(15px, 2.5vw, 20px);
    font-weight: 700;
    color: var(--accent2);
    margin: 24px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .style-h3::before {
    content: '◆';
    color: var(--gold);
    font-size: 0.7em;
  }

  /* ─── TEXT ─── */
  .style-text {
    text-align: left;
    font-size: clamp(13px, 2vw, 15px);
    line-height: 1.85;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    margin: 12px 0;
    white-space: pre-line;
  }

  .style-button {
    display: inline-flex;

    gap: 8px;
    margin: 16px 0;

  .style-image {
    width: 100%;
    max-width: 700px;
    display: block;
    margin: 16px auto;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .tabs-container { margin: 20px 0 0; }
  .tabs-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 0;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 10px 22px;
    border-radius: 12px 12px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--card);
    color: var(--text2);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    position: relative;
    top: 1px;

  .tab-btn.active {
    background: var(--card2);
    color: #fff;
    border-color: var(--accent);
    border-bottom: 1px solid var(--card2);
  }
  .tab-panel {
    display: none;
    background: var(--card2);
    border: 1px solid var(--accent);
    border-radius: 0 12px 12px 12px;
    padding: 24px;
  }
  .tab-panel.active { display: block; }

  /* ─── REWARD TABLE ─── */
  .reward-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 6px;
    margin: 8px 0;
  }
  .reward-table thead tr th {
    padding: 12px 10px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(255,215,0,0.08);
    border-top: 1px solid rgba(255,215,0,0.2);
    border-bottom: 1px solid rgba(255,215,0,0.2);
  }
  .reward-table thead tr th:first-child {
    border-radius: 8px 0 0 8px;
    border-left: 1px solid rgba(255,215,0,0.2);
  }
  .reward-table thead tr th:last-child {
    border-radius: 0 8px 8px 0;
    border-right: 1px solid rgba(255,215,0,0.2);
  }
  .reward-table tbody tr td {
    padding: 10px 10px;
    text-align: center;
    font-size: 13px;
    background: rgba(255,255,255,0.03);
    border-top: 1px solid rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background 0.2s;
  }
  .reward-table tbody tr:hover td {
    background: rgba(108,63,255,0.12);
  }
  .reward-table tbody tr td:first-child {
    border-radius: 8px 0 0 8px;
    border-left: 1px solid rgba(255,255,255,0.05);
    font-weight: 700;
    color: #fff;
  }
  .reward-table tbody tr td:last-child {
    border-radius: 0 8px 8px 0;
    border-right: 1px solid rgba(255,255,255,0.05);
  }

    height: 48px;

    border-radius: 8px;

</style>

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent.includes(lang.toUpperCase()))
  );
  // swap visible text
  document.querySelectorAll('[data-ru]').forEach(el => {
    el.textContent = lang === 'ru' ? el.dataset.ru : (el.dataset.uz || el.dataset.ru);
  });
  document.querySelectorAll('[data-ru-html]').forEach(el => {
    el.innerHTML = lang === 'ru' ? el.dataset.ruHtml : (el.dataset.uzHtml || el.dataset.ruHtml);
  });
  // swap images
  document.querySelectorAll('[data-img-ru]').forEach(el => {
    el.src = lang === 'ru' ? el.dataset.imgRu : (el.dataset.imgUz || el.dataset.imgRu);
  });
  // swap button href

}

// ══════════════════════════════════════════
//  CSV PARSER (handles quoted fields)
// ══════════════════════════════════════════
function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (let line of lines) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) {
        cols.push(cur.trim()); cur = '';
      } else cur += c;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

// ══════════════════════════════════════════
//  FETCH
// ══════════════════════════════════════════
async function fetchData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('Network error');
    const text = await res.text();
    return processCSV(text);
  } catch(e) {
    // fallback to embedded data
    return getEmbeddedData();
  }
}

function processCSV(text) {
  const rows = parseCSV(text);
  // skip header row
  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length < 3) continue;

      block:     r[0] || '',
      parent:    r[1] || '',
      stylecode: (r[2] || '').trim(),
      ru:        r[3] || '',
      uz:        r[4] || ''
    });
  }
  return data;
}

// ══════════════════════════════════════════
//  RENDER HELPERS
// ══════════════════════════════════════════
function isImageUrl(s) {
  return s && (s.startsWith('http') && (s.match(/\.(png|jpg|jpeg|gif|webp|svg)/i) || s.includes('bigolive') || s.includes('ibb.co')));
}

function renderCell(val) {
  if (isImageUrl(val)) return `<img src="${val}" alt="reward" loading="lazy">`;
  if (val === '0') return `<span style="color:var(--text2)">—</span>`;
  // format numbers with spaces
  if (/^\d[\d ]+$/.test(val)) return `<span class="cell-num">${val}</span>`;
  return `<span>${val}</span>`;
}

function getRowClass(label) {
  if (label.includes('🥇') || label.includes('Топ🥇')) return 'top1';
  if (label.includes('🥈') || label.includes('Топ🥈')) return 'top2';
  if (label.includes('🥉') || label.includes('Топ🥉')) return 'top3';
  return '';
}

// ══════════════════════════════════════════
//  BUILD PAGE
// ══════════════════════════════════════════
function buildPage(data) {
  // group by block
  const blocks = {};
  for (const row of data) {
    const b = row.block || 'x';
    if (!blocks[b]) blocks[b] = [];
    blocks[b].push(row);
  }

  let html = '<div class="page">';

  for (const [blockId, rows] of Object.entries(blocks)) {
    html += `<div class="block" style="animation-delay:${Object.keys(blocks).indexOf(blockId)*0.08}s">`;

    // Hero decoration for block 1
    if (blockId === '1') {
      html += `<div class="hero-decor">👨‍👩‍👧‍👦</div>`;
    }

    // Process rows — collect tabs first
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      const sc  = row.stylecode.toLowerCase();

      if (sc === 'title') {
        html += `<h1 class="style-title" data-ru="${esc(row.ru)}" data-uz="${esc(row.uz||row.ru)}">${esc(row.ru)}</h1>`;
        i++; continue;
      }

      if (sc === 'subtitle') {
        html += `<p class="style-subtitle" data-ru="${esc(row.ru)}" data-uz="${esc(row.uz||row.ru)}">${esc(row.ru)}</p>`;
        i++; continue;
      }

      if (sc === 'h1') {
        // check if RU contains a link (name/url)
        const parts = row.ru.split('/');
        const link  = parts.length >= 2 && parts[1].startsWith('http') ? parts[1] : null;
        const text  = link ? parts[0] : row.ru;
        const uzText = row.uz ? row.uz.split('/')[0] : text;
        if (link) {
          html += `<h2 class="style-h1"><a href="${link}" target="_blank" data-ru="${esc(text)}" data-uz="${esc(uzText)}">${esc(text)}</a></h2>`;
        } else {
          html += `<h2 class="style-h1"><span data-ru="${esc(text)}" data-uz="${esc(uzText)}">${esc(text)}</span></h2>`;
        }
        i++; continue;
      }

      if (sc === 'h3') {
        html += `<h3 class="style-h3" data-ru="${esc(row.ru)}" data-uz="${esc(row.uz||row.ru)}">${esc(row.ru)}</h3>`;
        i++; continue;
      }

      if (sc === 'text') {
        const ruText = row.ru.replace(/</g,'&lt;');
        const uzText = (row.uz||row.ru).replace(/</g,'&lt;');
        html += `<div class="style-text" data-ru-html="${encodeURIComponent(ruText)}" data-uz-html="${encodeURIComponent(uzText)}">${ruText}</div>`;
        i++; continue;
      }

      if (sc === 'button') {
        const parts   = row.ru.split('/');
        const label   = parts[0];
        const href    = parts.slice(1).join('/') || '#';
        const uzParts = row.uz ? row.uz.split('/') : parts;
        const uzLabel = uzParts[0] || label;
        const uzHref  = uzParts.slice(1).join('/') || href;
        html += `<div class="btn-wrap"><a class="style-button" href="${href}" data-href-ru="${href}" data-href-uz="${uzHref}" target="_blank">
          <span data-ru="${esc(label)}" data-uz="${esc(uzLabel)}">${esc(label)}</span> →
        </a></div>`;
        i++; continue;
      }

      if (sc === 'image') {
        const ruImg = row.ru.trim();
        const uzImg = row.uz.trim() || ruImg;
        html += `<img class="style-image" src="${ruImg}" data-img-ru="${ruImg}" data-img-uz="${uzImg}" alt="instruction" loading="lazy">`;
        i++; continue;
      }

      // ─── TABS ───
      if (sc === 'tab') {
        // collect all consecutive Tab groups from this block
        const tabGroups = [];
        let j = i;
        while (j < rows.length && rows[j].stylecode.toLowerCase() === 'tab') {
          const tabLabel = rows[j];
          const tabName  = tabLabel.ru;
          const tabUz    = tabLabel.uz || tabName;
          // collect children (same parent = tabName)
          const children = rows.filter(r => r.parent === tabName);
          tabGroups.push({ labelRu: tabName, labelUz: tabUz, children });
          j++;
        }
        i = j;

        const tid = 'tabs_' + blockId + '_' + i;
        html += `<div class="tabs-container" id="${tid}">`;
        html += `<div class="tabs-nav">`;
        tabGroups.forEach((tg, idx) => {
          html += `<button class="tab-btn${idx===0?' active':''}" 
            data-ru="${esc(tg.labelRu)}" data-uz="${esc(tg.labelUz)}"
            onclick="switchTab('${tid}',${idx})">${esc(tg.labelRu)}</button>`;
        });
        html += `</div>`;

        tabGroups.forEach((tg, idx) => {
          html += `<div class="tab-panel${idx===0?' active':''}">`;
          html += renderTabContent(tg.children);
          html += `</div>`;
        });
        html += `</div>`;
        continue;
      }

      i++;
    }

    html += `</div>`; // end block
  }

  html += '</div>';
  return html;
}

// ══════════════════════════════════════════
//  RENDER TAB CONTENT
// ══════════════════════════════════════════
function renderTabContent(rows) {
  let html = '';
  let i = 0;

  // separate RewardTable rows (first = header)
  const rewardRows = rows.filter(r => r.stylecode === 'RewardTable');
  const otherRows  = rows.filter(r => r.stylecode !== 'RewardTable');

  if (rewardRows.length > 0) {
    const headerRow = rewardRows[0];
    const dataRows  = rewardRows.slice(1);
    const headers   = headerRow.ru.split('/');
    const headersUz = (headerRow.uz || headerRow.ru).split('/');

    html += `<div style="overflow-x:auto"><table class="reward-table">`;
    html += `<thead><tr>`;
    headers.forEach((h, hi) => {
      html += `<th data-ru="${esc(h)}" data-uz="${esc(headersUz[hi]||h)}">${esc(h)}</th>`;
    });
    html += `</tr></thead><tbody>`;

    dataRows.forEach(row => {
      const cols   = row.ru.split('/');
      const colsUz = row.uz ? row.uz.split('/') : cols;
      const cls    = getRowClass(cols[0]);
      html += `<tr class="${cls}">`;
      cols.forEach((c, ci) => {
        const uzC = colsUz[ci] || c;
        // if both are images use data-img approach
        if (isImageUrl(c)) {
          html += `<td><img src="${c}" ${isImageUrl(uzC)?`data-img-ru="${c}" data-img-uz="${uzC}"`:''}  alt="" loading="lazy" style="width:48px;height:48px;object-fit:contain;border-radius:8px;display:block;margin:0 auto"></td>`;
        } else {
          html += `<td data-ru="${esc(c)}" data-uz="${esc(uzC)}">${renderCell(c)}</td>`;
        }
      });
      html += `</tr>`;
    });

    html += `</tbody></table></div>`;
  }

  // other rows (H3, Text, etc.)
  for (const row of otherRows) {
    const sc = row.stylecode.toLowerCase();
    if (sc === 'h3') {
      html += `<h3 class="style-h3" data-ru="${esc(row.ru)}" data-uz="${esc(row.uz||row.ru)}">${esc(row.ru)}</h3>`;
    } else if (sc === 'text') {
      const ruText = row.ru.replace(/</g,'&lt;');
      const uzText = (row.uz||row.ru).replace(/</g,'&lt;');
      html += `<div class="style-text" data-ru-html="${encodeURIComponent(ruText)}" data-uz-html="${encodeURIComponent(uzText)}">${ruText}</div>`;
    }
  }

  return html;
}

// ══════════════════════════════════════════
//  TAB SWITCH
// ══════════════════════════════════════════
function switchTab(containerId, idx) {
  const container = document.getElementById(containerId);
  container.querySelectorAll('.tab-btn').forEach((b,i)   => b.classList.toggle('active', i===idx));
  container.querySelectorAll('.tab-panel').forEach((p,i) => p.classList.toggle('active', i===idx));
}

// ══════════════════════════════════════════
//  ESCAPE
// ══════════════════════════════════════════
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
async function init() {
  const data = await fetchData();
  parsedData = data;
  document.getElementById('app').innerHTML = buildPage(data);

  // Fix encoded text blocks
  document.querySelectorAll('[data-ru-html]').forEach(el => {
    el.innerHTML = decodeURIComponent(el.dataset.ruHtml);
  });
}

init();
</script>
