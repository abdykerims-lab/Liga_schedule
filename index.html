<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мультичат Олимп</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-marble: #f4efea;
            --gold-primary: #d4a359;
            --gold-gradient: linear-gradient(180deg, #ffe8ad 0%, #c89542 100%);
            --gold-border: #e6c280;
            --text-dark: #1e132b;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background-color: var(--bg-marble);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 232, 173, 0.4), transparent 70%),
                linear-gradient(to bottom, #fdfbf7, #eae3d9);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .wrapper {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid var(--gold-border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(184, 134, 11, 0.12);
            position: relative;
        }

        /* --- Переключатель языков --- */
        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 12px;
        }

        .lang-btn {
            background: #fff;
            border: 1px solid var(--gold-border);
            border-radius: 6px;
            padding: 4px 10px;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--gold-gradient);
            color: #fff;
            border-color: var(--gold-primary);
        }

        /* --- Шапка --- */
        .header-title {
            text-align: center;
            margin-bottom: 16px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .header-title .subtitle {
            font-size: 14px;
            font-weight: 700;
            color: #2c1a4d;
            margin-top: 4px;
        }

        /* --- Поочередная анимация: Карточка -> Молния -> Карточка --- */
        .cards-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin: 20px 0;
            min-height: 110px;
            position: relative;
            width: 100%;
        }

        .olympus-card {
            flex: 1;
            max-width: 68px;
            height: 98px;
            border-radius: 8px;
            border: 1.5px solid var(--gold-border);
            background: #fff;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            padding: 2px;
            opacity: 0;
            transform: scale(0.3) translateY(20px);
            animation: cardPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            overflow: hidden;
        }

        .olympus-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        .card-1 { animation-delay: 0.1s; background: linear-gradient(135deg, #e0f7fa, #b2ebf2); }
        .card-2 { animation-delay: 0.7s; background: linear-gradient(135deg, #e8f5e9, #c8e6c9); }
        .card-3 { animation-delay: 1.3s; background: linear-gradient(135deg, #f3e5f5, #e1bee7); }
        .card-4 { animation-delay: 1.9s; background: linear-gradient(135deg, #fce4ec, #f8bbd0); }
        .card-5 { 
            animation-delay: 2.5s; 
            background: linear-gradient(135deg, #fff9c4, #ffe082); 
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .bolt {
            width: 3px;
            height: 70px;
            background: #fff;
            box-shadow: 0 0 8px #ffe600, 0 0 16px #ffaa00, 0 0 24px #ffffff;
            opacity: 0;
            transform: rotate(-12deg) scaleY(0);
            transform-origin: top;
            animation: lightningStrike 0.2s ease-out forwards;
        }

        .bolt-1 { animation-delay: 0.5s; }
        .bolt-2 { animation-delay: 1.1s; }
        .bolt-3 { animation-delay: 1.7s; }
        .bolt-4 { animation-delay: 2.3s; }

        @keyframes cardPop {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes lightningStrike {
            0% { opacity: 0; transform: rotate(-12deg) scaleY(0); }
            50% { opacity: 1; transform: rotate(-12deg) scaleY(1.2); }
            100% { opacity: 0; transform: rotate(-12deg) scaleY(1); }
        }

        /* --- Вкладки --- */
        .tabs-header {
            display: flex;
            width: 100%;
            border-bottom: 2px solid var(--gold-border);
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            font-family: 'Exo 2', sans-serif;
            font-size: 16px;
            font-weight: 700;
            background: none;
            border: none;
            color: #7a6b8a;
            padding: 10px 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .tab-btn.active { color: var(--text-dark); }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gold-gradient);
            border-radius: 2px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* --- Динамический Контент --- */
        h1 {
            font-size: 18px;
            font-weight: 700;
            color: #3b2354;
            margin: 16px 0 8px 0;
        }

        h2 {
            font-size: 16px;
            font-weight: 700;
            color: #3b2354;
            margin: 14px 0 6px 0;
        }

        p {
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .text-info-frame {
            font-size: 15px;
            font-weight: 700;
            border: 1.5px solid var(--gold-primary);
            background: rgba(212, 163, 89, 0.12);
            padding: 8px 12px;
            border-radius: 8px;
            display: block;
            margin: 8px 0;
            text-align: center;
            width: 100%;
        }

        .text-attention {
            font-size: 13px;
            font-style: italic;
            color: #c0392b;
            margin: 6px 0;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin: 12px 0;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            font-size: 14px;
        }

        th, td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background: var(--gold-gradient);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
        }

        /* --- Сетка Подарков (5 в ряд) --- */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 12px;
        }

        .gift-item {
            background: #fff;
            border: 1px solid var(--gold-border);
            border-radius: 6px;
            padding: 4px;
            text-align: center;
        }

        .gift-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .gift-item p {
            font-size: 11px;
            margin-top: 4px;
            font-weight: 600;
            word-break: break-word;
        }

        .loader {
            text-align: center;
            padding: 40px;
            font-weight: 700;
            color: var(--gold-primary);
        }

        @media (max-width: 380px) {
            .gifts-grid { grid-template-columns: repeat(3, 1fr); }
            .olympus-card { height: 85px; font-size: 9px; }
            .bolt { height: 50px; }
            .tab-btn { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('RU')">RU</button>
        <button class="lang-btn" onclick="setLanguage('UZB')">UZB</button>
    </div>

    <div class="header-title">
        <h1>МУЛЬТИЧАТ ОЛИМП</h1>
        <div class="subtitle">СОБЕРИ 4 КАРТОЧКИ, РАЗДЕЛИ ПРИЗОВОЙ ФОНД!</div>
    </div>

    <!-- Анимированные Карточки -->
    <div class="cards-container" id="cardsContainer">
        <div class="olympus-card card-1"><span>Карта 1</span></div>
        <div class="bolt bolt-1"></div>
        <div class="olympus-card card-2"><span>Карта 2</span></div>
        <div class="bolt bolt-2"></div>
        <div class="olympus-card card-3"><span>Карта 3</span></div>
        <div class="bolt bolt-3"></div>
        <div class="olympus-card card-4"><span>Карта 4</span></div>
        <div class="bolt bolt-4"></div>
        <div class="olympus-card card-5"><span>Олимп</span></div>
    </div>

    <!-- Переключение вкладок -->
    <div class="tabs-header">
        <button class="tab-btn active" id="btn-tab1" onclick="switchTab('tab1')">Условия</button>
        <button class="tab-btn" id="btn-tab2" onclick="switchTab('tab2')">Правила</button>
    </div>

    <div id="loading" class="loader">Загрузка данных из таблицы...</div>

    <!-- Вкладки Контента -->
    <div id="tab1" class="tab-content active"></div>
    <div id="tab2" class="tab-content"></div>
</div>

<script>
    const sheetId = '1nK2CM91wv9BwTuOpjUnwBgTA4vhrghu_BnVQF53a_gQ';
    const sheetName = 'Multichat';
    const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;

    let sheetData = [];
    let currentLang = 'RU'; // 'RU' или 'UZB'

    async function fetchSheetData() {
        try {
            const res = await fetch(gvizUrl);
            const text = await res.text();
            // Google GViz возвращает JSON, оборачивая его в "/*O_o*/\ngoogle.visualization.Query.setResponse(...);"
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;

            sheetData = rows.map(r => ({
                tag: r.c[0]?.v || '',
                group: r.c[1]?.v || '',
                ru: r.c[2]?.v || '',
                uzb: r.c[3]?.v || '',
                desc: r.c[4]?.v || ''
            }));

            document.getElementById('loading').style.display = 'none';
            renderApp();
        } catch (e) {
            document.getElementById('loading').innerText = 'Ошибка загрузки данных из таблицы.';
            console.error(e);
        }
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === lang);
        });
        renderApp();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        document.getElementById(`btn-${tabId}`).classList.add('active');
    }

    function renderApp() {
        if (!sheetData.length) return;

        const val = (item) => currentLang === 'UZB' ? (item.uzb || item.ru) : item.ru;

        // 1. Заголовки Вкладок
        const tab1Tag = sheetData.find(r => r.tag === 'Tab1');
        const tab2Tag = sheetData.find(r => r.tag === 'Tab2');
        if (tab1Tag) document.getElementById('btn-tab1').innerText = val(tab1Tag);
        if (tab2Tag) document.getElementById('btn-tab2').innerText = val(tab2Tag);

        // 2. Карточки в анимации
        const cardRows = sheetData.filter(r => r.tag === 'CardShow');
        const cardElements = document.querySelectorAll('.olympus-card');
        cardElements.forEach((el, idx) => {
            if (cardRows[idx]) {
                const imgUrl = val(cardRows[idx]);
                if (imgUrl.startsWith('http')) {
                    el.innerHTML = `<img src="${imgUrl}" alt="Card ${idx + 1}">`;
                }
            }
        });

        // 3. Генерация Контента для Tab1 и Tab2
        renderTabContent('tab1');
        renderTabContent('tab2');
    }

    function renderTabContent(tabId) {
        const container = document.getElementById(tabId);
        container.innerHTML = '';

        // Поиск элементов, относящихся к выбранному Tab
        // Элементы Tab1 могут быть без группы или с group=1..3; Tab2 от 4 и дальше
        const rows = sheetData.filter(r => {
            if (tabId === 'tab1') {
                return r.tag.startsWith('h1') || r.tag.startsWith('text_body') || 
                       r.tag.startsWith('text_info') || r.tag.startsWith('Table_') || 
                       r.tag.startsWith('Image_gift');
            } else {
                return r.tag.startsWith('h2') || r.tag.startsWith('text_attention') ||
                       (r.tag.startsWith('text_') && parseInt(r.group) >= 4) ||
                       (r.tag.startsWith('h1') && r.group === '');
            }
        });

        let currentTable = null;
        let giftsGrid = null;

        rows.forEach(r => {
            const text = currentLang === 'UZB' ? (r.uzb || r.ru) : r.ru;
            if (!text) return;

            // Логика разграничения контента между вкладками на базе структуры
            const isTab2Tag = ['h2', 'text_attention'].some(t => r.tag.startsWith(t)) || parseInt(r.group) >= 4;
            if (tabId === 'tab1' && isTab2Tag) return;
            if (tabId === 'tab2' && !isTab2Tag && r.tag !== 'h1') return;

            // Очистка от таблиц и сеток при переходе к другим блокам
            if (!r.tag.startsWith('Table_') && currentTable) { currentTable = null; }
            if (!r.tag.startsWith('Image_gift') && giftsGrid) { giftsGrid = null; }

            // Верстка Заголовков H1, H2
            if (r.tag.startsWith('h1')) {
                const h1 = document.createElement('h1');
                h1.innerText = text;
                container.appendChild(h1);
            } else if (r.tag.startsWith('h2')) {
                const h2 = document.createElement('h2');
                h2.innerText = text;
                container.appendChild(h2);
            } 
            // Обычный текст
            else if (r.tag.startsWith('text_body')) {
                const p = document.createElement('p');
                p.innerText = text;
                container.appendChild(p);
            } 
            // Текст в рамке
            else if (r.tag.startsWith('text_info')) {
                const div = document.createElement('div');
                div.className = 'text-info-frame';
                div.innerText = text;
                container.appendChild(div);
            } 
            // Предупреждение (Italic)
            else if (r.tag.startsWith('text_attention')) {
                const p = document.createElement('p');
                p.className = 'text-attention';
                p.innerText = text;
                container.appendChild(p);
            } 
            // Обработка Таблиц
            else if (r.tag.startsWith('Table_head')) {
                const wrapper = document.createElement('div');
                wrapper.className = 'table-container';
                currentTable = document.createElement('table');
                const thead = document.createElement('thead');
                const tr = document.createElement('tr');
                
                text.split(',').forEach(col => {
                    const th = document.createElement('th');
                    th.innerText = col.trim();
                    tr.appendChild(th);
                });

                thead.appendChild(tr);
                currentTable.appendChild(thead);
                currentTable.appendChild(document.createElement('tbody'));
                wrapper.appendChild(currentTable);
                container.appendChild(wrapper);
            } else if (r.tag.startsWith('Table_row') && currentTable) {
                const tbody = currentTable.querySelector('tbody');
                const tr = document.createElement('tr');
                
                text.split(',').forEach(col => {
                    const td = document.createElement('td');
                    td.innerText = col.trim();
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            } 
            // Обработка Сетки Подарков (5 в ряд)
            else if (r.tag.startsWith('Image_gift')) {
                if (!giftsGrid) {
                    giftsGrid = document.createElement('div');
                    giftsGrid.className = 'gifts-grid';
                    container.appendChild(giftsGrid);
                }

                const parts = text.split(',');
                const title = parts[0] ? parts[0].trim() : 'Gift';
                const imgUrl = parts[1] ? parts[1].trim() : 'https://via.placeholder.com/60/ffe8ad/3b2354?text=Gift';

                const item = document.createElement('div');
                item.className = 'gift-item';
                item.innerHTML = `<img src="${imgUrl}" alt="${title}"><p>${title}</p>`;
                giftsGrid.appendChild(item);
            }
        });
    }

    // Запуск приложения
    fetchSheetData();
</script>

</body>
</html>
