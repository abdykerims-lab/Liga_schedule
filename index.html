<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIGO Event Page - Family PK</title>

<!-- Подключаем шрифт Exo 2 -->
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-page: #f4f7fe; 
    --block-bg: #ffffff;
    --primary: #3b82f6; /* Энергичный синий для Family PK */
    --primary-dark: #1e3a8a;
    --accent: #f59e0b;  /* Золотой/Оранжевый акцент */
    --accent-light: #fef3c7;
    --text-main: #1e293b;
    --text-muted: #475569;
    --border-color: #e2e8f0;
    --shadow-soft: 0 12px 30px rgba(59, 130, 246, 0.08);
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: 'Exo 2', sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    top: -150px; left: 50%;
    transform: translateX(-50%);
    width: 100vw; max-width: 600px; height: 500px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(245, 158, 11, 0.05) 40%, transparent 70%);
    z-index: -1;
  }

  .container {
    max-width: 550px; 
    margin: 0 auto;
    padding: 15px 15px 50px;
  }

  /* ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ */
  .lang-switcher {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 25px;
    position: sticky;
    top: 15px;
    z-index: 100;
  }
  .lang-switcher::before {
    content: '';
    position: absolute; right: 0; top: 0;
    background: var(--block-bg);
    border-radius: 30px;
    width: 120px; height: 100%;
    z-index: -1;
    border: 1px solid var(--accent);
    box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15);
  }
  .lang-btn {
    background: transparent; border: none;
    color: var(--primary);
    padding: 8px 18px; border-radius: 20px;
    font-weight: 800; font-size: 13px;
    cursor: pointer; transition: 0.3s;
  }
  .lang-btn.active { background: var(--primary); color: #fff; }

  /* РАМКИ БЛОКОВ */
  .content-block {
    background: var(--block-bg);
    border-radius: 16px;
    padding: 25px 20px 25px; 
    margin-top: 40px; 
    margin-bottom: 25px;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--border-color);
    border-top: 3px solid var(--primary);
    position: relative;
    animation: fadeUp 0.6s ease-out backwards;
  }
  
  .content-block:nth-child(1) { margin-top: 10px; padding-top: 30px; border-top: 1px solid var(--border-color);}

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ТИПОГРАФИКА */
  .block-Title { 
    font-size: 34px; font-weight: 800; margin: 0 0 5px; 
    color: var(--primary-dark); text-align: center; line-height: 1.2;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .block-Subtitle { 
    font-size: 14px; font-weight: 700; margin-bottom: 25px; 
    color: var(--accent); text-align: center; text-transform: uppercase; 
  }
  
  /* H1 СКРУГЛЕННАЯ РАМКА */
  .h1-wrapper { 
    position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
    width: 90%; text-align: center; z-index: 10;
  }
  .block-H1 { 
    font-size: 16px; font-weight: 800; color: #fff; 
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 8px 24px; display: inline-block;
    text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
    border: 2px solid var(--accent); border-radius: 50px;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }
  .block-H1.has-link { cursor: pointer; text-decoration: none; transition: 0.3s; }
  .block-H1.has-link:hover { transform: scale(1.05); }
  .link-icon { font-size: 14px; margin-left: 5px; color: var(--accent-light); }

  .h1-wrapper + div { margin-top: 10px !important; }

  /* H3 */
  .block-H3 { 
    font-size: 16px; font-weight: 800; margin: 20px 0 10px; 
    color: var(--primary-dark); text-align: center;
  }
  
  /* TEXT - выравнивание по левому краю (как в задаче) */
  .block-Text { 
    font-size: 14px; margin-bottom: 15px; color: var(--text-muted); 
    line-height: 1.5; text-align: left; font-weight: 600;
  }
  
  /* ИЗОБРАЖЕНИЕ */
  .block-Image { text-align: center; margin: 20px 0; }
  .block-Image img { max-width: 100%; border-radius: 12px; box-shadow: var(--shadow-soft); }

  /* КНОПКА */
  .btn-container { text-align: center; margin: 25px 0 10px; }
  .btn-main {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), #f97316);
    color: #fff; padding: 14px 30px; border-radius: 50px;
    font-weight: 800; font-size: 15px; text-transform: uppercase; 
    letter-spacing: 1px; text-decoration: none;
    box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4); transition: 0.3s;
  }
  .btn-main:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.6); }

  /* ВКЛАДКИ (TABS) */
  .tabs-header {
    display: flex; gap: 8px; margin: 20px 0 15px;
    background: var(--bg-page); padding: 4px; border-radius: 12px;
  }
  .tab-btn {
    flex: 1; background: transparent; border: none;
    color: var(--text-muted); padding: 12px 5px; border-radius: 8px;
    font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.3s;
  }
  .tab-btn.active {
    background: var(--block-bg); color: var(--primary);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .tab-pane { animation: fadeIn 0.4s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ТАБЛИЦА НАГРАД (4 КОЛОНКИ) */
  .reward-table-container { 
    margin: 15px 0; overflow-x: auto; border-radius: 12px; 
    border: 1px solid var(--accent); box-shadow: var(--shadow-soft);
  }
  .reward-table {
    width: 100%; min-width: 400px; border-collapse: collapse; background: #fff; 
  }
  .reward-table th {
    background: var(--primary); color: #fff; font-weight: 800;
    padding: 12px 6px; border-bottom: 2px solid var(--accent);
    text-align: center; font-size: 11px; text-transform: uppercase;
  }
  .reward-table td {
    padding: 10px 6px; border-bottom: 1px solid var(--border-color);
    text-align: center; font-weight: 700; vertical-align: middle; 
    font-size: 12px; color: var(--text-main);
  }
  .reward-table tr:last-child td { border-bottom: none; }
  .reward-table tr:nth-child(even) { background: var(--bg-page); }
  .reward-icon { width: 45px; height: 45px; object-fit: contain; display: block; margin: 0 auto;}

  .loading { text-align: center; padding: 50px; font-weight: 700; color: var(--primary); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% {opacity: 0.5;} 50% {opacity: 1;} 100% {opacity: 0.5;} }
</style>
</head>
<body>

  <div class="container">
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-ru" onclick="switchLang('ru')">RU</button>
      <button class="lang-btn" id="btn-uz" onclick="switchLang('uz')">UZ</button>
    </div>

    <div id="content">
      <div class="loading">Загрузка данных... ⏳</div>
    </div>
  </div>

<script>
const sheetID = "1CqZoDGdr4OgsdXh9sFhGmhz4AAyhtX9TQWWuzSCdfRw";
const sheetGID = "0"; 

let currentLang = 'ru'; 
let pageBlocks = []; 

// Умная функция разделения, которая не ломает URL адреса слэшами
function parseRowData(str, maxCols) {
  let parts = str.split(',');
  if (parts.length <= maxCols) return parts;
  let result = parts.slice(0, maxCols - 1);
  result.push(parts.slice(maxCols - 1).join('/')); // Собираем остаток обратно в URL
  return result;
}

async function fetchData() {
  const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tq=SELECT%20A,B,C,D,E&gid=${sheetGID}&_=${Date.now()}`;
  
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows || [];

    let currentBlockId = null;
    let currentBlock = null;
    const getVal = (col) => (col && col.v !== null && col.v !== undefined) ? String(col.v).trim() : "";

    rows.forEach(r => {
      let blockId = getVal(r.c[0]) || currentBlockId || "";
      if (!blockId) return;

      if (blockId !== currentBlockId) {
        currentBlockId = blockId;
        currentBlock = { id: blockId, items: [], tabs: {}, tabNames: [] };
        pageBlocks.push(currentBlock);
      }

      let parent = getVal(r.c[1]);
      let rawStyle = getVal(r.c[2]);
      let ru = getVal(r.c[3]);
      let uz = getVal(r.c[4]);

      if (!rawStyle || rawStyle.toLowerCase() === 'stylecode') return;

      // Нормализация стилей
      let style = rawStyle.toLowerCase();
      if (style === 'title') style = 'Title';
      else if (style === 'subtitle') style = 'Subtitle';
      else if (style === 'text') style = 'Text';
      else if (style === 'button') style = 'Button';
      else if (style === 'h1') style = 'H1';
      else if (style === 'h3') style = 'H3';
      else if (style === 'tab') style = 'Tab';
      else if (style === 'rewardtable') style = 'RewardTable';
      else if (style === 'image') style = 'Image';

      let rowData = { style, parent, ru, uz };

      if (style === 'Tab') {
        let tabId = `tab_${currentBlockId}_${currentBlock.tabNames.length}`;
        currentBlock.tabNames.push({ nameRu: ru, nameUz: uz || ru, origParent: ru, id: tabId });
        currentBlock.tabs[tabId] = [];
      } else if (parent) {
        let tabInfo = currentBlock.tabNames.find(t => t.origParent === parent);
        if (tabInfo) currentBlock.tabs[tabInfo.id].push(rowData);
      } else {
        currentBlock.items.push(rowData);
      }
    });

    renderPage();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="loading">❌ Ошибка загрузки данных</div>`;
    console.error(e);
  }
}

function switchLang(lang) {
  currentLang = lang;
  document.getElementById("btn-ru").classList.toggle("active", lang === 'ru');
  document.getElementById("btn-uz").classList.toggle("active", lang === 'uz');
  renderPage();
}

window.switchTab = function(btn, tabId) {
  let parentHeader = btn.parentElement;
  parentHeader.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  let contentArea = parentHeader.nextElementSibling;
  contentArea.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
  contentArea.querySelector('#' + tabId).style.display = 'block';
}

function renderElementGroup(rows) {
  let out = "";
  let inTable = false;

  rows.forEach((row, index) => {
    let content = currentLang === 'ru' ? row.ru : row.uz;
    if (!content) content = row.ru; 
    if (!content) return; 

    if (row.style === 'RewardTable') {
      if (!inTable) {
        out += `<div class="reward-table-container"><table class="reward-table"><tbody>`;
        inTable = true;
      }
      let cols = parseRowData(content, 4); // Делим строго на 4 колонки
      out += `<tr>`;
      let isHeader = (index === 0 || rows[index-1].style !== 'RewardTable');
      cols.forEach(col => {
        let val = col.trim();
        let tag = isHeader ? 'th' : 'td';
        if (val.startsWith('http')) {
          out += `<${tag}><img src="${val}" class="reward-icon" alt="reward"></${tag}>`;
        } else {
          out += `<${tag}>${val.replace(/\n/g, '<br>')}</${tag}>`;
        }
      });
      out += `</tr>`;
    } else {
      if (inTable) { out += `</tbody></table></div>`; inTable = false; }

      if (row.style === 'H1') {
        let parts = parseRowData(content, 2);
        if(parts[1]) out += `<div class="h1-wrapper"><a href="${parts[1]}" target="_blank" class="block-H1 has-link">${parts[0]} <span class="link-icon">🔗</span></a></div>`;
        else out += `<div class="h1-wrapper"><div class="block-H1">${parts[0]}</div></div>`;
      }
      else if (row.style === 'Button') {
        let parts = parseRowData(content, 2);
        let name = parts[0] ? parts[0].trim() : '';
        let link = parts[1] ? parts[1].trim() : '#';
        out += `<div class="btn-container"><a href="${link}" target="_blank" class="btn-main">${name}</a></div>`;
      }
      else if (row.style === 'Image') {
        out += `<div class="block-Image"><img src="${content}" alt="Image"></div>`;
      }
      else if (row.style === 'Title' || row.style === 'Subtitle' || row.style === 'H3' || row.style === 'Text') {
        out += `<div class="block-${row.style}">${content.replace(/\n/g, '<br>')}</div>`;
      }
    }
  });
  if (inTable) out += `</tbody></table></div>`;
  
  return out;
}

function renderPage() {
  const container = document.getElementById("content");
  let html = "";

  pageBlocks.forEach((block, bIndex) => {
    html += `<div class="content-block" style="animation-delay: ${bIndex * 0.1}s">`;
    
    // 1. Рисуем элементы блока (до вкладок)
    html += renderElementGroup(block.items);

    // 2. Рисуем вкладки (если они есть)
    if (block.tabNames.length > 0) {
      html += `<div class="tabs-header">`;
      block.tabNames.forEach((tab, index) => {
        let tabName = currentLang === 'ru' ? tab.nameRu : tab.nameUz;
        let activeClass = index === 0 ? 'active' : '';
        html += `<button class="tab-btn ${activeClass}" onclick="switchTab(this, '${tab.id}')">${tabName}</button>`;
      });
      html += `</div>`;

      html += `<div class="tabs-content">`;
      block.tabNames.forEach((tab, index) => {
        let activeStyle = index === 0 ? 'display:block;' : 'display:none;';
        html += `<div class="tab-pane" id="${tab.id}" style="${activeStyle}">`;
        html += renderElementGroup(block.tabs[tab.id] || []);
        html += `</div>`;
      });
      html += `</div>`;
    }

    html += `</div>`; 
  });

  container.innerHTML = html;
}

fetchData();
</script>
</body>
</html>
