<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIGO Event Page - Multichat</title>

<!-- Подключаем шрифт Exo 2 -->
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-page: #fefffd; 
    --block-bg: #ffffff;
    --kurban-green: #0d5c46; 
    --kurban-green-dark: #073b2d;
    --kurban-gold: #d4af37; 
    --kurban-gold-light: #fdfaf0;
    --text-main: #1a2622;
    --text-muted: #4f635c;
    --border-color: #e5edea;
    --shadow-soft: 0 12px 30px rgba(13, 92, 70, 0.06);
  }

  body {
    background-color: var(--bg-page); color: var(--text-main); font-family: 'Exo 2', sans-serif;
    margin: 0; padding: 0; line-height: 1.6; -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
  }

  body::before {
    content: ''; position: absolute; top: -150px; left: 50%; transform: translateX(-50%);
    width: 100vw; max-width: 600px; height: 500px;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(13, 92, 70, 0.05) 40%, transparent 70%); z-index: -1;
  }

  .container { max-width: 550px; margin: 0 auto; padding: 15px 15px 50px; }

  /* ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ */
  .lang-switcher { display: flex; justify-content: flex-end; margin-bottom: 30px; position: sticky; top: 15px; z-index: 100; }
  .lang-switcher::before {
    content: ''; position: absolute; right: 0; top: 0; background: var(--block-bg); border-radius: 30px; width: 120px; height: 100%; z-index: -1;
    border: 1px solid var(--kurban-gold); box-shadow: 0 4px 10px rgba(212, 175, 55, 0.15);
  }
  .lang-btn { background: transparent; border: none; color: var(--kurban-green); padding: 8px 18px; border-radius: 20px; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.3s; }
  .lang-btn.active { background: var(--kurban-green); color: #fff; }

  /* РАМКИ БЛОКОВ */
  .content-block {
    background: var(--block-bg); border-radius: 16px; padding: 25px 20px 25px; margin-top: 40px; margin-bottom: 25px; box-shadow: var(--shadow-soft);
    border: 1px solid var(--kurban-gold); position: relative; animation: fadeUp 0.6s ease-out backwards;
  }
  .content-block:nth-child(1) { margin-top: 10px; padding-top: 25px;} 

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .block-Title, .block-Subtitle, .block-Text, .block-H1, .block-H2, .block-H3 { text-align: center; }

  .block-Title { font-size: 32px; font-weight: 800; margin: 0 0 5px; color: var(--kurban-green-dark); line-height: 1.2; }
  .block-Subtitle { font-size: 15px; font-weight: 700; margin-bottom: 25px; color: var(--kurban-gold); text-transform: uppercase; letter-spacing: 2px; }
  
  .h1-wrapper { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); width: 90%; text-align: center; z-index: 10; }
  .block-H1 { 
    font-size: 16px; font-weight: 800; color: var(--kurban-green-dark); background: var(--block-bg); padding: 8px 24px; display: inline-block; text-transform: uppercase;
    letter-spacing: 1px; white-space: nowrap; border: 2px solid var(--kurban-gold); border-radius: 50px; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.1); 
  }
  .block-H1::before { content: '✦ '; color: var(--kurban-gold); font-weight: 400;}
  .block-H1::after { content: ' ✦'; color: var(--kurban-gold); font-weight: 400;}
  .h1-wrapper + div { margin-top: 0 !important; }

  .block-H2 { font-size: 20px; font-weight: 800; margin: 20px 0 5px; color: var(--kurban-green); display: block; position: relative; }
  .block-H2::after { content: ''; display: block; width: 50px; height: 3px; background: var(--kurban-gold); border-radius: 2px; margin: 6px auto 0; }
  
  .block-H3 { font-size: 16px; font-weight: 700; margin: 15px 0 5px; color: var(--kurban-gold);}
  .block-Text { font-size: 15px; margin-bottom: 5px; color: var(--text-muted); line-height: 1.4;}
  .block-Rule { font-size: 14px; margin-bottom: 10px; color: var(--text-muted); line-height: 1.5; text-align: justify; font-weight: 600;}
  
  .block-Image { text-align: center; margin: 20px 0; }
  .block-Image img { max-width: 100%; border-radius: 12px; box-shadow: 0 8px 20px rgba(13, 92, 70, 0.1); border: 1px solid var(--border-color);}

  /* ВКЛАДКИ */
  .tabs-header { display: flex; gap: 6px; margin: 20px 0 15px; background: var(--kurban-gold-light); padding: 4px; border-radius: 12px; border: 1px solid var(--kurban-gold); }
  .tab-btn { flex: 1; background: transparent; border: none; color: var(--kurban-green-dark); padding: 10px 2px; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; transition: 0.3s; text-transform: uppercase; word-break: break-word; line-height: 1.2; }
  .tab-btn.active { background: var(--kurban-green); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .tab-pane { animation: fadeIn 0.4s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* СЕТКА ПОДАРКОВ GIFTCARD */
  .grid-giftcard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 20px 0; }
  .giftcard-item { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 4px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .giftcard-item img { width: 85%; aspect-ratio: 1/1; object-fit: contain; margin-bottom: 6px; background: var(--kurban-gold-light); border-radius: 6px; padding: 2px;}
  .giftcard-item span { font-weight: 700; font-size: 9px; display: block; line-height: 1.2; color: var(--text-main); word-break: break-word; text-transform: uppercase;}


  /* ==================================================== */
  /* АНИМАЦИЯ СИНТЕЗА КАРТОЧЕК (CARDSHOW)                 */
  /* ==================================================== */
  .cardshow-wrapper { margin: 40px auto 30px; display: flex; justify-content: center; }
  
  .cs-box {
    position: relative;
    width: 260px; height: 260px;
    border-radius: 50%;
  }

  /* Базовый стиль для карточек */
  .cs-anim-item {
    position: absolute;
    width: 60px; height: 85px;
    background: var(--block-bg);
    border: 2px solid var(--kurban-gold);
    border-radius: 10px;
    padding: 3px;
    box-shadow: var(--shadow-soft);
    z-index: 2;
  }
  .cs-anim-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }

  /* Позиции по углам и их анимации */
  .cs-pos-1 { top: 0; left: 0; animation: flyTL 7s infinite cubic-bezier(0.4, 0, 0.2, 1); }
  .cs-pos-2 { top: 0; right: 0; animation: flyTR 7s infinite cubic-bezier(0.4, 0, 0.2, 1); }
  .cs-pos-3 { bottom: 0; right: 0; animation: flyBR 7s infinite cubic-bezier(0.4, 0, 0.2, 1); }
  .cs-pos-4 { bottom: 0; left: 0; animation: flyBL 7s infinite cubic-bezier(0.4, 0, 0.2, 1); }

  /* Центр: 130px. Середина маленькой карты: 30x, 42.5y */
  @keyframes flyTL {
    0%, 15% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
    30%, 85% { transform: translate(100px, 87px) rotate(720deg) scale(0); opacity: 0; }
    95%, 100% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
  }
  @keyframes flyTR {
    0%, 15% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
    30%, 85% { transform: translate(-100px, 87px) rotate(-720deg) scale(0); opacity: 0; }
    95%, 100% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
  }
  @keyframes flyBR {
    0%, 15% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
    30%, 85% { transform: translate(-100px, -87px) rotate(720deg) scale(0); opacity: 0; }
    95%, 100% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
  }
  @keyframes flyBL {
    0%, 15% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
    30%, 85% { transform: translate(100px, -87px) rotate(-720deg) scale(0); opacity: 0; }
    95%, 100% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
  }

  /* Большая центральная карточка (Синтезированная) */
  .cs-center-card {
    position: absolute;
    top: 50%; left: 50%;
    width: 85px; height: 120px;
    margin-top: -60px; margin-left: -42.5px;
    background: var(--block-bg);
    border: 2px solid var(--kurban-green-dark);
    border-radius: 12px; padding: 4px; z-index: 10;
    animation: popCenter 8s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .cs-center-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }

  @keyframes popCenter {
    0%, 30% { transform: scale(0) translateY(20px); opacity: 0; box-shadow: 0 0 0 transparent; }
    35% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 40px var(--kurban-gold); }
    40%, 80% { transform: scale(1); opacity: 1; box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }
    90%, 100% { transform: scale(0) translateY(-20px); opacity: 0; }
  }

  /* Магическое кольцо (вспышка при синтезе) */
  .cs-magic-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 120px; height: 120px;
    margin-top: -60px; margin-left: -60px;
    border: 3px dashed var(--kurban-gold);
    border-radius: 50%; z-index: 1;
    animation: ringFlash 10s infinite linear;
  }
  @keyframes ringFlash {
    0%, 25% { transform: scale(0) rotate(0deg); opacity: 0; }
    30% { transform: scale(1.2) rotate(45deg); opacity: 1; border-color: var(--kurban-green); }
    45%, 80% { transform: scale(2) rotate(180deg); opacity: 0; }
    100% { transform: scale(0) rotate(360deg); opacity: 0; }
  }


  /* КНОПКИ */
  .grid-Button { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 25px 0 10px; }
  .btn-item { background: transparent; color: var(--kurban-green); text-align: center; padding: 14px 10px; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 13px; text-transform: uppercase; border: 2px solid var(--kurban-green); transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
  .btn-item:hover { background: var(--kurban-green); color: #fff; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(13, 92, 70, 0.2); }

  /* ТАБЛИЦА НАГРАД */
  .reward-table-container { margin: 20px 0; overflow-x: auto; border-radius: 12px; border: 1px solid var(--kurban-gold); box-shadow: var(--shadow-soft); }
  .reward-table { width: 100%; border-collapse: collapse; background: #fff; min-width: 320px; }
  .reward-table th { background: var(--kurban-green); color: #fff; font-weight: 800; padding: 14px 10px; border-bottom: 2px solid var(--kurban-gold); text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .reward-table td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); text-align: center; font-weight: 700; vertical-align: middle; font-size: 13px; color: var(--kurban-green-dark); }
  .reward-table tr:last-child td { border-bottom: none; }
  .reward-table tr:nth-child(even) { background: var(--kurban-gold-light); }
  .reward-icon { width: 40px; height: 40px; object-fit: contain; display: block; margin: 0 auto;}

  .loading { text-align: center; padding: 50px; font-size: 16px; font-weight: 700; color: var(--kurban-green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% {opacity: 0.5;} 50% {opacity: 1;} 100% {opacity: 0.5;} }
</style>
</head>
<body>

  <div class="container">
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-ru" onclick="switchLang('ru')">RU</button>
      <button class="lang-btn" id="btn-uz" onclick="switchLang('uz')">UZ</button>
    </div>
    <div id="content"><div class="loading">Загрузка данных... ⏳</div></div>
  </div>

<script>
const sheetID = "1YZh92BcRe-ctZjJNxnRCNgSCgw3i4UEuu6STb_06PUo";
const sheetGID = "1424048071"; 

let currentLang = 'ru'; 
let pageBlocks = []; 

function parseRowData(str, maxCols) {
  let parts = str.split(',');
  if (parts.length <= maxCols) return parts;
  let result = parts.slice(0, maxCols - 1);
  result.push(parts.slice(maxCols - 1).join(','));
  return result;
}

async function fetchData() {
  const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tq=SELECT%20A,B,C,D,E&gid=${sheetGID}&_=${Date.now()}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows || [];

    let currentBlockId = null;
    let currentBlock = null;
    const getVal = (col) => (col && col.v !== null && col.v !== undefined) ? String(col.v).trim() : "";

    rows.forEach(r => {
      let blockId = getVal(r.c[0]) || currentBlockId || "";
      if (!blockId) return;

      if (blockId !== currentBlockId) {
        currentBlockId = blockId;
        currentBlock = { id: blockId, items: [], tabs: {}, tabNames: [] };
        pageBlocks.push(currentBlock);
      }

      let parent = getVal(r.c[1]);
      let rawStyle = getVal(r.c[2]);
      let ru = getVal(r.c[3]);
      let uz = getVal(r.c[4]);

      if (!rawStyle || rawStyle.toLowerCase() === 'styleсode' || rawStyle.toLowerCase() === 'stylecode') return;

      let style = rawStyle.toLowerCase();
      if (style === 'title') style = 'Title';
      else if (style === 'subtitle') style = 'Subtitle';
      else if (style === 'text') style = 'Text';
      else if (style === 'rule') style = 'Rule';
      else if (style === 'button') style = 'Button';
      else if (style === 'h1') style = 'H1';
      else if (style === 'h2') style = 'H2';
      else if (style === 'h3') style = 'H3';
      else if (style === 'tab') style = 'Tab';
      else if (style === 'rewardtable') style = 'RewardTable';
      else if (style === 'giftcard') style = 'giftcard';
      else if (style === 'cardshow') style = 'cardshow';

      let rowData = { style, parent, ru, uz };

      if (style === 'Tab') {
        let tabId = `tab_${currentBlockId}_${currentBlock.tabNames.length}`;
        currentBlock.tabNames.push({ nameRu: ru, nameUz: uz || ru, origParent: ru, id: tabId });
        currentBlock.tabs[tabId] = [];
      } else if (parent) {
        let tabInfo = currentBlock.tabNames.find(t => t.origParent === parent);
        if (tabInfo) currentBlock.tabs[tabInfo.id].push(rowData);
      } else {
        currentBlock.items.push(rowData);
      }
    });

    renderPage();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="loading">❌ Ошибка загрузки данных</div>`;
    console.error(e);
  }
}

function switchLang(lang) {
  currentLang = lang;
  document.getElementById("btn-ru").classList.toggle("active", lang === 'ru');
  document.getElementById("btn-uz").classList.toggle("active", lang === 'uz');
  renderPage();
}

window.switchTab = function(btn, tabId) {
  let parentHeader = btn.parentElement;
  parentHeader.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  let contentArea = parentHeader.nextElementSibling;
  contentArea.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
  contentArea.querySelector('#' + tabId).style.display = 'block';
}

function renderElementGroup(rows) {
  let out = "";
  let inTable = false;
  let inButtonGrid = false;
  let inGiftCard = false;

  function closeGroups(currentStyle) {
    if (inTable && currentStyle !== 'RewardTable') { out += `</tbody></table></div>`; inTable = false; }
    if (inButtonGrid && currentStyle !== 'Button') { out += `</div>`; inButtonGrid = false; }
    if (inGiftCard && currentStyle !== 'giftcard') { out += `</div>`; inGiftCard = false; }
  }

  rows.forEach((row, index) => {
    let content = currentLang === 'ru' ? row.ru : row.uz;
    if (!content) content = row.ru; 
    if (!content) return; 

    closeGroups(row.style);

    if (row.style === 'RewardTable') {
      if (!inTable) { out += `<div class="reward-table-container"><table class="reward-table"><tbody>`; inTable = true; }
      let cols = parseRowData(content, 3);
      out += `<tr>`;
      let isHeader = (index === 0 || rows[index-1].style !== 'RewardTable');
      cols.forEach(col => {
        let val = col.trim();
        let tag = isHeader ? 'th' : 'td';
        if (val.startsWith('http')) out += `<${tag}><img src="${val}" class="reward-icon" alt="reward"></${tag}>`;
        else out += `<${tag}>${val.replace(/\n/g, '<br>')}</${tag}>`;
      });
      out += `</tr>`;
    } 
    else if (row.style === 'giftcard') {
      if (!inGiftCard) { out += `<div class="grid-giftcard">`; inGiftCard = true; }
      
      let cards = content.split(',');
      cards.forEach(cardStr => {
        if (!cardStr.trim()) return;
        let parts = cardStr.split(/<br\s*\/?>/i);
        let cardName = parts[0] ? parts[0].trim() : '';
        let imgLink = parts[1] ? parts[1].trim() : '';
        
        if (cardName || imgLink) {
            out += `
            <div class="giftcard-item">
              ${imgLink ? `<img src="${imgLink}" alt="gift">` : ''}
              <span>${cardName}</span>
            </div>`;
        }
      });
    }
    // АНИМИРОВАННЫЙ БЛОК СИНТЕЗА КАРТОЧЕК
    else if (row.style === 'cardshow') {
      let urls = content.split(',').map(s => s.trim());
      out += `
      <div class="cardshow-wrapper">
        <div class="cs-box">
          <div class="cs-magic-ring"></div>
          
          <div class="cs-anim-item cs-pos-1"><img src="${urls[0] || ''}"></div>
          <div class="cs-anim-item cs-pos-2"><img src="${urls[1] || ''}"></div>
          <div class="cs-anim-item cs-pos-3"><img src="${urls[2] || ''}"></div>
          <div class="cs-anim-item cs-pos-4"><img src="${urls[3] || ''}"></div>
          
          <div class="cs-center-card"><img src="${urls[4] || ''}"></div>
        </div>
      </div>`;
    }
    else if (row.style === 'Button') {
      if (!inButtonGrid) { out += `<div class="grid-Button">`; inButtonGrid = true; }
      let parts = parseRowData(content, 2);
      out += `<a href="${parts[1] ? parts[1].trim() : '#'}" target="_blank" class="btn-item">${parts[0] ? parts[0].trim() : ''}</a>`;
    }
    else if (row.style === 'H1') {
      out += `<div class="h1-wrapper"><div class="block-H1">${content}</div></div>`;
    }
    else if (row.style === 'Title' || row.style === 'Subtitle' || row.style === 'H2' || row.style === 'H3' || row.style === 'Text' || row.style === 'Rule') {
      out += `<div class="block-${row.style}">${content.replace(/\n/g, '<br>')}</div>`;
    }
  });
  
  closeGroups(''); 
  return out;
}

function renderPage() {
  const container = document.getElementById("content");
  let html = "";

  pageBlocks.forEach((block, bIndex) => {
    html += `<div class="content-block" style="animation-delay: ${bIndex * 0.1}s">`;
    html += renderElementGroup(block.items);

    if (block.tabNames.length > 0) {
      html += `<div class="tabs-header">`;
      block.tabNames.forEach((tab, index) => {
        let tabName = currentLang === 'ru' ? tab.nameRu : tab.nameUz;
        let activeClass = index === 0 ? 'active' : '';
        html += `<button class="tab-btn ${activeClass}" onclick="switchTab(this, '${tab.id}')">${tabName}</button>`;
      });
      html += `</div>`;

      html += `<div class="tabs-content">`;
      block.tabNames.forEach((tab, index) => {
        let activeStyle = index === 0 ? 'display:block;' : 'display:none;';
        html += `<div class="tab-pane" id="${tab.id}" style="${activeStyle}">`;
        html += renderElementGroup(block.tabs[tab.id] || []);
        html += `</div>`;
      });
      html += `</div>`;
    }
    html += `</div>`; 
  });

  container.innerHTML = html;
}

fetchData();
</script>
</body>
</html>
