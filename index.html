<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультичат Олимп</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-marble: #f4efea;
            --gold-primary: #d4a359;
            --gold-gradient: linear-gradient(180deg, #ffe8ad 0%, #c89542 100%);
            --gold-border: #e6c280;
            --text-dark: #1e132b;
            --card-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background-color: var(--bg-marble);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 232, 173, 0.5), transparent 70%),
                linear-gradient(to bottom, #fdfbf7, #eae3d9);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .wrapper {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 3px solid var(--gold-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(184, 134, 11, 0.15);
            position: relative;
        }

        /* --- Шапка Олимп --- */
        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }

        .header-title .subtitle {
            font-size: 18px;
            font-weight: 700;
            color: #2c1a4d;
            margin-top: 5px;
        }
