<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIGO Event Page - Multichat</title>

<!-- Подключаем шрифт Exo 2 -->
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-page: #fefffd; 
    --block-bg: #ffffff;
    --kurban-green: #0d5c46; 
    --kurban-green-dark: #073b2d;
    --kurban-gold: #d4af37; 
    --kurban-gold-light: #fdfaf0;
    --text-main: #1a2622;
    --text-muted: #4f635c;
    --border-color: #e5edea;
    --shadow-soft: 0 12px 30px rgba(13, 92, 70, 0.06);
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: 'Exo 2', sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    top: -150px; left: 50%;
    transform: translateX(-50%);
    width: 100vw; max-width: 600px; height: 500px;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(13, 92, 70, 0.05) 40%, transparent 70%);
    z-index: -1;
  }

  .container {
    max-width: 550px; 
    margin: 0 auto;
    padding: 15px 15px 50px;
  }

  /* ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ */
  .lang-switcher {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 30px;
    position: sticky;
    top: 15px;
    z-index: 100;
  }
  .lang-switcher::before {
    content: '';
    position: absolute; right: 0; top: 0;
    background: var(--block-bg);
    border-radius: 30px;
    width: 120px; height: 100%;
    z-index: -1;
    border: 1px solid var(--kurban-gold);
    box-shadow: 0 4px 10px rgba(212, 175, 55, 0.15);
  }
  .lang-btn {
    background: transparent;
    border: none;
    color: var(--kurban-green);
    padding: 8px 18px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
  }
  .lang-btn.active { 
    background: var(--kurban-green); 
    color: #fff; 
  }

  /* РАМКИ БЛОКОВ */
  .content-block {
    background: var(--block-bg);
    border-radius: 16px;
    padding: 25px 20px 25px;
    margin-top: 40px; 
    margin-bottom: 25px;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--kurban-gold);
    position: relative;
    animation: fadeUp 0.6s ease-out backwards;
  }
  
  .content-block:nth-child(1) { margin-top: 10px; padding-top: 25px;} 

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ЦЕНТРИРОВАНИЕ ВСЕХ ТЕКСТОВ (Как в образце) */
  .block-Title, .block-Subtitle, .block-Text, 
  .block-H1, .block-H2, .block-H3 {
    text-align: center;
  }

  /* ТИПОГРАФИКА */
  .block-Title { 
    font-size: 32px; font-weight: 800; margin: 0 0 5px; 
    color: var(--kurban-green-dark); line-height: 1.2;
  }
  .block-Subtitle { 
    font-size: 15px; font-weight: 700; margin-bottom: 25px; 
    color: var(--kurban-gold); text-transform: uppercase; letter-spacing: 2px;
  }
  
  /* H1 СКРУГЛЕННАЯ РАМКА (ВРЕЗАН В БЛОК) */
  .h1-wrapper { 
    position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
    width: 90%; text-align: center; z-index: 10;
  }
  .block-H1 { 
    font-size: 16px; font-weight: 800; color: var(--kurban-green-dark); 
    background: var(--block-bg); 
    padding: 8px 24px; display: inline-block; text-transform: uppercase;
    letter-spacing: 1px; white-space: nowrap; border: 2px solid var(--kurban-gold); 
    border-radius: 50px; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.1); 
  }
  .block-H1::before { content: '✦ '; color: var(--kurban-gold); font-weight: 400;}
  .block-H1::after { content: ' ✦'; color: var(--kurban-gold); font-weight: 400;}
  .h1-wrapper + div { margin-top: 0 !important; }

  /* H2 С ЛИНИЕЙ */
  .block-H2 { 
    font-size: 20px; font-weight: 800; margin: 20px 0 5px; 
    color: var(--kurban-green); display: block; position: relative;
  }
  .block-H2::after { 
    content: ''; display: block; width: 50px; height: 3px; 
    background: var(--kurban-gold); border-radius: 2px; margin: 6px auto 0;
  }
  
  /* H3 */
  .block-H3 { font-size: 16px; font-weight: 700; margin: 15px 0 5px; color: var(--kurban-gold);}
  
  /* TEXT */
  .block-Text { font-size: 15px; margin-bottom: 5px; color: var(--text-muted); line-height: 1.4;}
  
  /* ИЗОБРАЖЕНИЕ */
  .block-Image { text-align: center; margin: 20px 0; }
  .block-Image img { max-width: 100%; border-radius: 12px; box-shadow: 0 8px 20px rgba(13, 92, 70, 0.1); border: 1px solid var(--border-color);}

  /* ВКЛАДКИ (3 В РЯД, в стиле Курбан) */
  .tabs-header {
    display: flex; gap: 6px; margin: 20px 0 15px; 
    background: var(--kurban-gold-light); padding: 4px; border-radius: 12px;
    border: 1px solid var(--kurban-gold);
  }
  .tab-btn {
    flex: 1; background: transparent; border: none; color: var(--kurban-green-dark); 
    padding: 10px 2px; border-radius: 8px; font-weight: 800; font-size: 11px; 
    cursor: pointer; transition: 0.3s; text-transform: uppercase; word-break: break-word; line-height: 1.2;
  }
  .tab-btn.active { background: var(--kurban-green); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .tab-pane { animation: fadeIn 0.4s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* СЕТКА ПОДАРКОВ GIFTCARD (5 в ряд) */
  .grid-giftcard {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 20px 0;
  }
  .giftcard-item {
    background: #fff; border: 1px solid var(--border-color); border-radius: 10px;
    padding: 6px 4px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  }
  .giftcard-item img {
    width: 85%; aspect-ratio: 1/1; object-fit: contain; margin-bottom: 6px;
    background: var(--kurban-gold-light); border-radius: 6px; padding: 2px;
  }
  .giftcard-item span { 
    font-weight: 700; font-size: 9px; display: block; line-height: 1.2; color: var(--text-main); word-break: break-word; text-transform: uppercase;
  }

  /* CARDSHOW (СИНТЕЗ В ЦЕНТР) - Зелено-золотой стиль */
  .cardshow-wrapper { margin: 30px auto 20px; max-width: 280px; }
  .cardshow {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 15px; position: relative; justify-items: center; align-items: center;
  }
  .cs-item {
    width: 65px; height: 65px; background: var(--block-bg); border: 2px solid var(--kurban-gold);
    border-radius: 12px; box-shadow: var(--shadow-soft); padding: 4px;
    display: flex; align-items: center; justify-content: center; z-index: 2; position: relative;
  }
  .cs-item img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px;}
  
  .cs-center {
    grid-column: 2; grid-row: 2; width: 85px; height: 85px;
    border-color: var(--kurban-green); background: var(--kurban-gold-light);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); z-index: 3;
    animation: pulseGlow 2s infinite alternate;
  }
  @keyframes pulseGlow { from { transform: scale(1); } to { transform: scale(1.08); box-shadow: 0 0 25px rgba(212, 175, 55, 0.7); } }
  
  .cs-1 { grid-column: 1; grid-row: 1; }
  .cs-2 { grid-column: 3; grid-row: 1; }
  .cs-3 { grid-column: 3; grid-row: 3; }
  .cs-4 { grid-column: 1; grid-row: 3; }

  .cs-arrow { position: absolute; width: 28px; height: 28px; color: var(--kurban-gold); z-index: 1; opacity: 0.9; }
  .arr-tl { top: 21%; left: 21%; }
  .arr-tr { top: 21%; right: 21%; }
  .arr-br { bottom: 21%; right: 21%; }
  .arr-bl { bottom: 21%; left: 21%; }

  /* КНОПКИ (2 В РЯД, ПРОЗРАЧНЫЕ) */
  .grid-Button {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 25px 0 10px;
  }
  .btn-item {
    background: transparent; color: var(--kurban-green); text-align: center; 
    padding: 14px 10px; border-radius: 50px; text-decoration: none; 
    font-weight: 800; font-size: 13px; text-transform: uppercase; 
    border: 2px solid var(--kurban-green); transition: all 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-item:hover { 
    background: var(--kurban-green); color: #fff; 
    transform: translateY(-2px); box-shadow: 0 6px 15px rgba(13, 92, 70, 0.2);
  }

  /* ТАБЛИЦА НАГРАД */
  .reward-table-container { 
    margin: 20px 0; overflow-x: auto; border-radius: 12px; 
    border: 1px solid var(--kurban-gold); box-shadow: var(--shadow-soft);
  }
  .reward-table {
    width: 100%; border-collapse: collapse; background: #fff; min-width: 320px;
  }
  .reward-table th {
    background: var(--kurban-green); color: #fff; font-weight: 800;
    padding: 14px 10px; border-bottom: 2px solid var(--kurban-gold);
    text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  }
  .reward-table td {
    padding: 12px 10px; border-bottom: 1px solid var(--border-color);
    text-align: center; font-weight: 700; vertical-align: middle; font-size: 13px; color: var(--kurban-green-dark);
  }
  .reward-table tr:last-child td { border-bottom: none; }
  .reward-table tr:nth-child(even) { background: var(--kurban-gold-light); }
  .reward-icon { width: 40px; height: 40px; object-fit: contain; display: block; margin: 0 auto;}

  .loading { text-align: center; padding: 50px; font-size: 16px; font-weight: 700; color: var(--kurban-green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% {opacity: 0.5;} 50% {opacity: 1;} 100% {opacity: 0.5;} }
</style>
</head>
<body>

  <div class="container">
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-ru" onclick="switchLang('ru')">RU</button>
      <button class="lang-btn" id="btn-uz" onclick="switchLang('uz')">UZ</button>
    </div>

    <div id="content">
      <div class="loading">Загрузка данных... ⏳</div>
    </div>
  </div>

<script>
// НОВАЯ ТАБЛИЦА
const sheetID = "1YZh92BcRe-ctZjJNxnRCNgSCgw3i4UEuu6STb_06PUo";
const sheetGID = "1424048071"; 

let currentLang = 'ru'; 
let pageBlocks = []; 

function parseRowData(str, maxCols) {
  let parts = str.split(',');
  if (parts.length <= maxCols) return parts;
  let result = parts.slice(0, maxCols - 1);
  result.push(parts.slice(maxCols - 1).join(','));
  return result;
}

async function fetchData() {
  const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tq=SELECT%20A,B,C,D,E&gid=${sheetGID}&_=${Date.now()}`;
  
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows || [];

    let currentBlockId = null;
    let currentBlock = null;
    const getVal = (col) => (col && col.v !== null && col.v !== undefined) ? String(col.v).trim() : "";

    rows.forEach(r => {
      let blockId = getVal(r.c[0]) || currentBlockId || "";
      if (!blockId) return;

      if (blockId !== currentBlockId) {
        currentBlockId = blockId;
        currentBlock = { id: blockId, items: [], tabs: {}, tabNames: [] };
        pageBlocks.push(currentBlock);
      }

      let parent = getVal(r.c[1]);
      let rawStyle = getVal(r.c[2]);
      let ru = getVal(r.c[3]);
      let uz = getVal(r.c[4]);

      if (!rawStyle || rawStyle.toLowerCase() === 'styleсode' || rawStyle.toLowerCase() === 'stylecode') return;

      let style = rawStyle.toLowerCase();
      if (style === 'title') style = 'Title';
      else if (style === 'subtitle') style = 'Subtitle';
      else if (style === 'text') style = 'Text';
      else if (style === 'button') style = 'Button';
      else if (style === 'h1') style = 'H1';
      else if (style === 'h2') style = 'H2';
      else if (style === 'h3') style = 'H3';
      else if (style === 'tab') style = 'Tab';
      else if (style === 'rewardtable') style = 'RewardTable';
      else if (style === 'giftcard') style = 'giftcard';
      else if (style === 'cardshow') style = 'cardshow';

      let rowData = { style, parent, ru, uz };

      if (style === 'Tab') {
        let tabId = `tab_${currentBlockId}_${currentBlock.tabNames.length}`;
        currentBlock.tabNames.push({ nameRu: ru, nameUz: uz || ru, origParent: ru, id: tabId });
        currentBlock.tabs[tabId] = [];
      } else if (parent) {
        let tabInfo = currentBlock.tabNames.find(t => t.origParent === parent);
        if (tabInfo) currentBlock.tabs[tabInfo.id].push(rowData);
      } else {
        currentBlock.items.push(rowData);
      }
    });

    renderPage();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="loading">❌ Ошибка загрузки данных</div>`;
    console.error(e);
  }
}

function switchLang(lang) {
  currentLang = lang;
  document.getElementById("btn-ru").classList.toggle("active", lang === 'ru');
  document.getElementById("btn-uz").classList.toggle("active", lang === 'uz');
  renderPage();
}

window.switchTab = function(btn, tabId) {
  let parentHeader = btn.parentElement;
  parentHeader.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  let contentArea = parentHeader.nextElementSibling;
  contentArea.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
  contentArea.querySelector('#' + tabId).style.display = 'block';
}

function renderElementGroup(rows) {
  let out = "";
  let inTable = false;
  let inButtonGrid = false;
  let inGiftCard = false;

  function closeGroups(currentStyle) {
    if (inTable && currentStyle !== 'RewardTable') { out += `</tbody></table></div>`; inTable = false; }
    if (inButtonGrid && currentStyle !== 'Button') { out += `</div>`; inButtonGrid = false; }
    if (inGiftCard && currentStyle !== 'giftcard') { out += `</div>`; inGiftCard = false; }
  }

  rows.forEach((row, index) => {
    let content = currentLang === 'ru' ? row.ru : row.uz;
    if (!content) content = row.ru; 
    if (!content) return; 

    closeGroups(row.style);

    if (row.style === 'RewardTable') {
      if (!inTable) { out += `<div class="reward-table-container"><table class="reward-table"><tbody>`; inTable = true; }
      let cols = parseRowData(content, 3); // 3 колонки для новой таблицы
      out += `<tr>`;
      let isHeader = (index === 0 || rows[index-1].style !== 'RewardTable');
      cols.forEach(col => {
        let val = col.trim();
        let tag = isHeader ? 'th' : 'td';
        if (val.startsWith('http')) out += `<${tag}><img src="${val}" class="reward-icon" alt="reward"></${tag}>`;
        else out += `<${tag}>${val.replace(/\n/g, '<br>')}</${tag}>`;
      });
      out += `</tr>`;
    } 
    else if (row.style === 'giftcard') {
      if (!inGiftCard) { out += `<div class="grid-giftcard">`; inGiftCard = true; }
      let temp = content.replace(/(https?:\/\/[^\s<]+)/g, '|$1|').split('|');
      for (let i = 0; i < temp.length - 1; i += 2) {
          let name = temp[i].replace(/<br>/gi, '').replace(/^[, ]+/, '').replace(/[, ]+$/, '').trim();
          let url = temp[i+1].trim();
          if(name || url) out += `<div class="giftcard-item"><img src="${url}"><span>${name}</span></div>`;
      }
    }
    else if (row.style === 'cardshow') {
      let urls = content.split(',').map(s => s.trim());
      out += `
      <div class="cardshow-wrapper">
        <div class="cardshow">
          <div class="cs-item cs-1"><img src="${urls[0] || ''}"></div>
          <div class="cs-item cs-2"><img src="${urls[1] || ''}"></div>
          <div class="cs-item cs-center"><img src="${urls[4] || ''}"></div>
          <div class="cs-item cs-4"><img src="${urls[3] || ''}"></div>
          <div class="cs-item cs-3"><img src="${urls[2] || ''}"></div>
          
          <svg class="cs-arrow arr-tl" viewBox="0 0 24 24"><path fill="currentColor" d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5H9z"/></svg>
          <svg class="cs-arrow arr-tr" viewBox="0 0 24 24"><path fill="currentColor" d="M15 5v2h-6.59L20 18.59 18.59 20 7 8.41V15H5V5h10z"/></svg>
          <svg class="cs-arrow arr-br" viewBox="0 0 24 24"><path fill="currentColor" d="M15 19v-2h-6.59L20 5.41 18.59 4 7 15.59V9H5v10h10z"/></svg>
          <svg class="cs-arrow arr-bl" viewBox="0 0 24 24"><path fill="currentColor" d="M9 19v-2h6.59L4 5.41 5.41 4 17 15.59V9h2v10H9z"/></svg>
        </div>
      </div>`;
    }
    else if (row.style === 'Button') {
      if (!inButtonGrid) { out += `<div class="grid-Button">`; inButtonGrid = true; }
      let parts = parseRowData(content, 2);
      out += `<a href="${parts[1] ? parts[1].trim() : '#'}" target="_blank" class="btn-item">${parts[0] ? parts[0].trim() : ''}</a>`;
    }
    else if (row.style === 'H1') {
      out += `<div class="h1-wrapper"><div class="block-H1">${content}</div></div>`;
    }
    else if (row.style === 'Title' || row.style === 'Subtitle' || row.style === 'H2' || row.style === 'H3' || row.style === 'Text') {
      out += `<div class="block-${row.style}">${content.replace(/\n/g, '<br>')}</div>`;
    }
  });
  
  closeGroups(''); 
  return out;
}

function renderPage() {
  const container = document.getElementById("content");
  let html = "";

  pageBlocks.forEach((block, bIndex) => {
    html += `<div class="content-block" style="animation-delay: ${bIndex * 0.1}s">`;
    html += renderElementGroup(block.items);

    if (block.tabNames.length > 0) {
      html += `<div class="tabs-header">`;
      block.tabNames.forEach((tab, index) => {
        let tabName = currentLang === 'ru' ? tab.nameRu : tab.nameUz;
        let activeClass = index === 0 ? 'active' : '';
        html += `<button class="tab-btn ${activeClass}" onclick="switchTab(this, '${tab.id}')">${tabName}</button>`;
      });
      html += `</div>`;

      html += `<div class="tabs-content">`;
      block.tabNames.forEach((tab, index) => {
        let activeStyle = index === 0 ? 'display:block;' : 'display:none;';
        html += `<div class="tab-pane" id="${tab.id}" style="${activeStyle}">`;
        html += renderElementGroup(block.tabs[tab.id] || []);
        html += `</div>`;
      });
      html += `</div>`;
    }
    html += `</div>`; 
  });

  container.innerHTML = html;
}

fetchData();
</script>
</body>
</html>
